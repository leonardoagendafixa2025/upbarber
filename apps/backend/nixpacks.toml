[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --workspace=@connect-barber/backend --include-workspace-root"]

[phases.build]
cmds = [
  "npm run build --workspace=@connect-barber/backend",
  "cd apps/backend && npx prisma generate"
]

[start]
cmd = "cd apps/backend && npx prisma migrate deploy && node dist/main"
